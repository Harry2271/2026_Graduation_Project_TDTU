name: Deploy Robot Controller

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          # Loại bỏ ký tự lạ nếu có
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Verify Health
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          source /opt/ros/jazzy/setup.bash
          
          echo "⏳ Waiting for Lidar topic /scan (max 30s)..."
          for i in {1..30}; do
            if ros2 topic list | grep -q "/scan"; then
              echo "✅ Lidar is UP and publishing!"
              exit 0
            fi
            echo "..."
            sleep 1
          done
          
          echo "❌ Lidar topic NOT FOUND after 30s. Check logs:"
          pm2 logs nexus-robot-lidar --lines 20
          exit 1