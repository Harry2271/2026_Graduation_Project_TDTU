# =============================================================================
# deploy.yml — Path-filtered deploy of the robot-for-nguyen monorepo
#
# Uses dorny/paths-filter to detect which app(s) changed and only runs the
# matching deploy job. Each app's per-app `deploy.sh` does the actual work on
# the self-hosted runner (the Raspberry Pi 5).
#
# Mobile app is intentionally NOT in the filter — no CI/CD per project decision.
#
# Filter map:
#   api  → apps/api/**
#   web  → apps/web/**
#   robot → services/robot/**
#
# A change to `tools/deploy/**` (shared manual SSH toolkit) or to this workflow
# file itself re-runs all three deploy jobs — the former because all three
# depend on those scripts being intact, the latter so workflow edits actually
# get tested. Use `workflow_dispatch` for ad-hoc redeploys.
# =============================================================================

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed paths
    runs-on: self-hosted
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      robot: ${{ steps.filter.outputs.robot }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'tools/deploy/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'tools/deploy/**'
              - '.github/workflows/deploy.yml'
            robot:
              - 'services/robot/**'
              - 'tools/deploy/**'
              - '.github/workflows/deploy.yml'
            tools:
              - 'tools/deploy/**'

  deploy-api:
    name: Deploy API (NestJS)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # apps/api/deploy.sh handles the full lifecycle on the Pi: git reset/clean,
      # yarn install (with devDeps for the build), `nest build`, sanity check
      # dist/main.js, prune to --production, write .env, restart PM2. We
      # intentionally do NOT pre-build here — doing so split the build from the
      # PM2 launch across two different `yarn install` invocations and let the
      # dist/ output go out of sync with the production node_modules.
      - name: Run API deploy
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: ${{ vars.API_PORT }}
          JWT_SIGN_SECRET: ${{ secrets.JWT_SIGN_SECRET }}
          ROBOT_BRAIN_TOKEN: ${{ secrets.ROBOT_BRAIN_TOKEN }}
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          cd apps/api
          chmod +x ./deploy.sh
          sed -i 's/\r$//' ./deploy.sh
          ./deploy.sh

      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:${{ vars.API_PORT }} || (echo "Health check failed"; exit 1)

  deploy-web:
    name: Deploy Web (Next.js)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web deploy
        env:
          PORT: ${{ vars.WEB_PORT }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          cd apps/web
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

  deploy-robot:
    name: Deploy Robot Controller (ROS 2)
    needs: detect
    if: needs.detect.outputs.robot == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        env:
          ROBOT_BRAIN_TOKEN: ${{ secrets.ROBOT_BRAIN_TOKEN }}
          API_SOCKET_URL: ${{ vars.API_SOCKET_URL }}
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          cd services/robot
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Verify health
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          source /opt/ros/jazzy/setup.bash

          echo "⏳ Waiting for Lidar topic /scan (max 30s)..."
          for i in {1..30}; do
            if ros2 topic list | grep -q "/scan"; then
              echo "✅ Lidar is UP and publishing!"
              exit 0
            fi
            echo "..."
            sleep 1
          done

          echo "❌ Lidar topic NOT FOUND after 30s. Check logs:"
          pm2 logs nexus-robot-lidar --lines 20
          exit 1
