name: CI/CD Pipeline Park Smart trên Pi 5

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Cú chốt: Báo cho GitHub biết đẩy việc về con Pi

    steps:
      - name: 📥 Lấy code mới nhất
        uses: actions/checkout@v4

      - name: 🛠️ Build ParkingService
        run: docker build -t parkingservice-test ./backend/Services/parking-service

      # 🔹 Tạo file .env bảo mật (Phân tách Variables và Secrets)
      - name: 🔐 Khởi tạo file .env cho ParkingService
        run: |
          echo ">>> Đang tạo file .env bảo mật..."
          
          # Dùng > để ghi đè file mới tinh, tránh dính rác từ lần chạy trước
          cat <<EOF > .env
          PORT=${{ vars.PORT }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          EOF
          
          echo ">>> Khởi tạo .env thành công."

      # 🔹 Chạy Docker Compose
      - name: 🚀 Deploy hệ thống
        run: |
          echo ">>> Bắt đầu dọn dẹp và chạy container mới..."
          docker compose down
          docker compose up -d --build
          echo ">>> Deploy Park Smart hoàn tất!"