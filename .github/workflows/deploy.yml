name: Deploy Robot Controller

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy via Script
        run: |
          # Nạp đường dẫn PM2 và Node
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          
          # Làm sạch file và thực thi
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Verify Health
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          echo "Waiting for ROS 2 nodes to stabilize..."
          sleep 10
          
          # Kiểm tra PM2
          pm2 status
          
          # Kiểm tra Topic (Nạp source để dùng lệnh ros2)
          source /opt/ros/jazzy/setup.bash
          ros2 topic list | grep "/scan" || (echo "❌ Lidar topic NOT FOUND. Check logs: pm2 logs nexus-robot-lidar"; exit 1)
          echo "✅ Everything is running!"