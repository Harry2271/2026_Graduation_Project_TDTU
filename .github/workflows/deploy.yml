name: Deploy Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install & Build
        run: |
          yarn install --frozen-lockfile
          NEXT_TELEMETRY_DISABLED=1 yarn build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next/
            public/
            package.json
            yarn.lock
            next.config.ts

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: .

      - name: Run deploy script
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:3000 || (echo "Health check failed"; exit 1)
