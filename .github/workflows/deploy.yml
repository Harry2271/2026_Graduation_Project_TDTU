# =============================================================================
# deploy.yml — Path-filtered Docker deploy of the robot-for-nguyen monorepo
#
# API and Web are built as Docker images and run as containers on the Pi
# (self-hosted runner). Robot service keeps its direct-PM2 deploy path
# (ROS 2 + serial ports can't live inside a container).
#
# Filter map:
#   api   → apps/api/** (also docker-compose.yml, postinstall, workflow file)
#   web   → apps/web/** (also docker-compose.yml, postinstall, workflow file)
#   robot → services/robot/** (also workflow file)
#
# A change to docker-compose.yml, scripts/postinstall-hoist-next.js, or this
# workflow file itself re-runs the relevant deploy job(s).
# =============================================================================


name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed paths
    runs-on: self-hosted
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      robot: ${{ steps.filter.outputs.robot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docker-compose.yml'
              - 'scripts/postinstall-hoist-next.js'
              - 'package.json'
              - 'yarn.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'docker-compose.yml'
              - 'scripts/postinstall-hoist-next.js'
              - 'package.json'
              - 'yarn.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
            robot:
              - 'services/robot/**'
              - '.github/workflows/deploy.yml'

  deploy-api:
    name: Deploy API (Docker)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write API env file
        run: |
          mkdir -p apps/api
          cat > apps/api/.env <<'ENVEOF'
          API_PORT=${{ vars.API_PORT || '5000' }}
          PORT=${{ vars.API_PORT || '5000' }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SIGN_SECRET=${{ secrets.JWT_SIGN_SECRET }}
          ROBOT_BRAIN_TOKEN=${{ secrets.ROBOT_BRAIN_TOKEN }}
          MAPS_DIR=${{ vars.MAPS_DIR || '/home/pi/robot_ws/maps' }}
          API_SOCKET_URL=${{ vars.API_SOCKET_URL || 'https://api.nguyen-robot.io.vn' }}
          ENVEOF

      - name: Build and start API container
        run: docker compose up -d --build --force-recreate api

      - name: Health check
        run: |
          echo "⏳ Waiting for API container to become healthy (max 60s)..."
          for i in $(seq 1 30); do
            if docker compose exec -T api curl -sf http://localhost:5000 > /dev/null 2>&1; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "❌ API health check failed"
          docker compose logs api --tail=50
          exit 1

  deploy-web:
    name: Deploy Web (Docker)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write API env file for Compose validation
        run: |
          mkdir -p apps/api
          cat > apps/api/.env <<'ENVEOF'
          API_PORT=${{ vars.API_PORT || '5000' }}
          PORT=${{ vars.API_PORT || '5000' }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SIGN_SECRET=${{ secrets.JWT_SIGN_SECRET }}
          ROBOT_BRAIN_TOKEN=${{ secrets.ROBOT_BRAIN_TOKEN }}
          MAPS_DIR=${{ vars.MAPS_DIR || '/home/pi/robot_ws/maps' }}
          API_SOCKET_URL=${{ vars.API_SOCKET_URL || 'https://api.nguyen-robot.io.vn' }}
          ENVEOF

      - name: Build and start Web container
        env:
          PORT: ${{ vars.WEB_PORT || '3000' }}
          WEB_PORT: ${{ vars.WEB_PORT || '3000' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_SOCKET_URL: ${{ vars.NEXT_PUBLIC_API_SOCKET_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_WS_AUTH_TOKEN: ${{ secrets.WS_AUTH_TOKEN || secrets.ROBOT_BRAIN_TOKEN }}
          NEXT_PUBLIC_CAMERA_STREAM_URL: ${{ vars.NEXT_PUBLIC_CAMERA_STREAM_URL }}
        run: docker compose up -d --build --force-recreate web

      - name: Health check
        run: |
          echo "⏳ Waiting for Web container to become healthy (max 90s)..."
          for i in $(seq 1 45); do
            if docker compose exec -T web node -e "fetch('http://localhost:3000').then(r=>{if(r.ok)process.exit(0);else process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "✅ Web is healthy"
              exit 0
            fi
            echo "  attempt $i/45..."
            sleep 2
          done
          echo "❌ Web health check failed"
          docker compose logs web --tail=50
          exit 1

  deploy-robot:
    name: Deploy Robot Controller (ROS 2)
    needs: detect
    if: needs.detect.outputs.robot == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        env:
          ROBOT_BRAIN_TOKEN: ${{ secrets.ROBOT_BRAIN_TOKEN }}
          WS_AUTH_TOKEN: ${{ secrets.WS_AUTH_TOKEN || secrets.ROBOT_BRAIN_TOKEN }}
          API_SOCKET_URL: ${{ vars.API_SOCKET_URL }}
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          cd services/robot
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Verify LiDAR driver
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          LIDAR_NAME=nexus-robot-lidar
          LIDAR_LOG=/home/pi/.pm2/logs/${LIDAR_NAME}-out.log

          echo "⏳ Waiting for LiDAR driver scan mode (max 30s)..."
          for i in {1..15}; do
            PM2_STATUS=$(pm2 jlist | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const app = JSON.parse(input).find(({name}) => name === process.argv[1]); process.stdout.write(app?.pm2_env?.status ?? 'missing'); });" "$LIDAR_NAME")
            if [ "$PM2_STATUS" = "online" ] && grep -q "current scan mode:" "$LIDAR_LOG"; then
              echo "✅ LiDAR driver is online and scanning"
              exit 0
            fi
            echo "  attempt $i/15 (PM2=$PM2_STATUS)..."
            sleep 2
          done

          echo "❌ LiDAR driver did not reach scan mode. Check logs:"
          pm2 logs "$LIDAR_NAME" --lines 40 --nostream
          exit 1
