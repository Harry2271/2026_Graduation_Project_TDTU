name: Deploy Park Smart Web

on:
  push:
    branches: ['master']

jobs:
  # --- JOB 1: CHẠY TRÊN MÁY CHỦ GITHUB (Offload Build) ---
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build
        run: |
          yarn install
          yarn build

      # Chuẩn bị thư mục phân phối hoàn chỉnh (bao gồm cả các file ẩn)
      - name: Prepare distribution folder
        run: |
          mkdir dist
          # Copy nội dung standalone vào dist
          cp -r .next/standalone/* dist/
          cp -r .next/standalone/.next dist/ || true
          # Copy static và public vào đúng vị trí Next.js standalone mong đợi
          mkdir -p dist/.next/static
          cp -r .next/static/* dist/.next/static/
          cp -r public dist/
          # Copy các file cấu hình docker
          cp Dockerfile docker-compose.yml dist/

      - name: Upload Artifact (Lưu Cache)
        uses: actions/upload-artifact@v4
        with:
          name: park-smart-web-build
          path: dist/

  # --- JOB 2: CHẠY TRÊN CON PI (Triển khai Docker) ---
  deploy-to-pi:
    needs: build-and-cache
    runs-on: self-hosted
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: park-smart-web-build
          path: ./web-client

      - name: 🔐 Khởi tạo file .env cho Frontend
        run: |
          cd ./web-client 
          echo ">>> Đang tạo file .env bảo mật..."

          # Dùng > để ghi đè file mới tinh, tránh dính rác từ lần chạy trước
          cat <<EOF > .env
          PORT=${{ vars.PORT }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          EOF

          echo ">>> Khởi tạo .env thành công."

      # Xóa container cũ, build image mới và chạy container mới
      - name: Deploy with Docker Compose
        run: |
          cd ./web-client
          # Docker Compose sẽ tự làm hết: dừng, xóa, build, chạy
          docker compose up -d --build
          # Dọn dẹp image cũ để tiết kiệm dung lượng thẻ nhớ
          docker image prune -f
