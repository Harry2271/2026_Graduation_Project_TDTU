name: Deploy Robot Controller

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and Deploy
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          # Loại bỏ ký tự lạ nếu có
          sed -i 's/\r$//' ./deploy.sh
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Verify Health
        run: |
          export PATH=$PATH:/usr/local/bin:$(npm config get prefix)/bin
          sleep 5
          pm2 status
          source /opt/ros/jazzy/setup.bash
          ros2 topic list | grep "/scan" || (echo "Lidar topic not found"; exit 1)