name: CI/CD Pipeline NestJS Monolithic trên Pi 5

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: self-hosted # Đẩy việc về thẳng con Pi

    steps:
      - name: 📥 Lấy code mới nhất
        uses: actions/checkout@v4

      - name: 🔐 Khởi tạo file .env bảo mật
        run: |
          echo ">>> Đang tạo file .env..."
          
          # Đứng ngay thư mục gốc đẻ ra file .env luôn
          cat <<EOF > .env
          PORT=${{ vars.PORT }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          EOF
          
          echo ">>> Khởi tạo .env thành công."

      - name: 📦 Cài đặt thư viện
        run: yarn install --frozen-lockfile

      - name: 🛠️ Build ứng dụng NestJS
        run: yarn build

      - name: 🚀 Deploy bằng PM2
        run: |
          echo ">>> Khởi động/Cập nhật dịch vụ..."
          # Đổi tên process thành api-backend cho ngầu và đúng bản chất
          pm2 start dist/main.js --name "api-backend" || pm2 reload "api-backend"

          echo ">>> Lưu cấu hình PM2..."
          pm2 save
          
          echo ">>> Deploy dự án hoàn tất!"