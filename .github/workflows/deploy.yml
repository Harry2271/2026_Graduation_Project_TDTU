name: Deploy Park Smart API

on:
  push:
    branches: ['master']

jobs:
  # --- JOB 1: CHẠY TRÊN MÁY CHỦ GITHUB (Offload Build) ---
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # 👈 Nâng lên Node 22 đồng bộ với máy Dev

      - name: Install dependencies & Build
        run: |
          yarn install
          yarn build

      # Nén thư mục dist và các file cần thiết lại làm "Cache"
      - name: Upload Artifact (Lưu Cache)
        uses: actions/upload-artifact@v3
        with:
          name: park-smart-build
          path: |
            dist/
            package.json
            yarn.lock
            Dockerfile # 👈 Phải ném thêm cái Dockerfile vào cục hàng

  # --- JOB 2: CHẠY TRÊN CON PI (Triển khai Docker) ---
  deploy-to-pi:
    needs: build-and-cache
    runs-on: self-hosted
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: park-smart-build
          path: ./api-server

      # Xóa container cũ, build image mới và chạy container mới
      - name: Deploy with Docker
        run: |
          cd ./api-server
          
          # 1. Build image Docker mới từ đống file tải về
          docker build -t park-smart-api-image .
          
          # 2. Dừng và xóa container cũ (nếu có) để tránh kẹt cổng. Lệnh || true giúp bỏ qua lỗi nếu container chưa tồn tại
          docker stop park-smart-api-container || true
          docker rm park-smart-api-container || true
          
          # 3. Khởi chạy container mới. 
          # --network host: Dùng chung mạng với Pi để dễ gọi chéo API Python local
          # --restart unless-stopped: Pi khởi động lại là Docker tự bật
          docker run -d \
            --name park-smart-api-container \
            --network host \
            --restart unless-stopped \
            park-smart-api-image
            
          # 4. (Tùy chọn) Dọn rác các image cũ không còn xài để nhẹ ổ cứng Pi
          docker image prune -f