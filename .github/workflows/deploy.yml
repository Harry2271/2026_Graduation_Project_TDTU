name: Deploy Park Smart Web

on:
  push:
    branches: ['master']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-pi:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Khởi tạo file .env cho Frontend
        run: |
          echo ">>> Đang tạo file .env bảo mật..."
          # Dùng > để ghi đè file mới tinh, tránh dính rác từ lần chạy trước
          cat <<EOF > .env
          PORT=${{ vars.PORT }}
          NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          EOF
          echo ">>> Khởi tạo .env thành công."

      # Xóa container cũ, build image mới (sử dụng multi-stage cache) và chạy container mới
      - name: Deploy with Docker Compose
        run: |
          # Dọn dẹp container "web" cũ (nếu được tạo từ project cũ web-client) để tránh lỗi Conflict tên
          docker rm -f web 2>/dev/null || true
          # Docker Compose sẽ tự làm hết: dừng, xóa, build, chạy
          docker compose up -d --build
          # Dọn dẹp image cũ để tiết kiệm dung lượng thẻ nhớ
          docker image prune -f
