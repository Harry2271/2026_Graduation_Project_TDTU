name: Deploy Park Smart API

on:
  push:
    branches: ['master']

jobs:
  # --- JOB 1: CHẠY TRÊN MÁY CHỦ GITHUB (Offload Build) ---
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 👈 Đổi thành v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 👈 Đổi thành v4
        with:
          node-version: '22'

      - name: Install dependencies & Build
        run: |
          yarn install
          yarn build

      # Nén thư mục dist và các file cần thiết lại làm "Cache"
      - name: Upload Artifact (Lưu Cache)
        uses: actions/upload-artifact@v4 # 👈 Đổi thành v4
        with:
          name: park-smart-build
          path: |
            dist/
            package.json
            yarn.lock
            Dockerfile
            docker-compose.yml

  # --- JOB 2: CHẠY TRÊN CON PI (Triển khai Docker) ---
  deploy-to-pi:
    needs: build-and-cache
    runs-on: self-hosted
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4 # 👈 Đổi thành v4
        with:
          name: park-smart-build
          path: ./api-server

      # Xóa container cũ, build image mới và chạy container mới
      - name: Deploy with Docker Compose
        run: |
          cd ./api-server
          # Docker Compose sẽ tự làm hết: dừng, xóa, build, chạy
          docker compose up -d --build
          # Dọn dẹp image cũ để tiết kiệm dung lượng thẻ nhớ
          docker image prune -f
