name: Deploy Robot Core

on:
  push:
    branches: ["master"]

jobs:
  # --- JOB 1: CHẠY TRÊN MÁY CHỦ GITHUB (Chuẩn bị Source) ---
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Artifact (Lưu Source)
        uses: actions/upload-artifact@v4
        with:
          name: robot-core-build
          path: |
            src/
            Dockerfile
            docker-compose.yml
            entrypoint.sh

  # --- JOB 2: CHẠY TRÊN CON PI (Triển khai Docker) ---
  deploy-to-pi:
    needs: prepare-source
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-core-build
          path: ./robot-app

      - name: 🔐 Khởi tạo file .env cho Robot (Nếu cần)
        run: |
          cd ./robot-app
          echo ">>> Đang tạo file .env cho ROS..."
          cat <<EOF > .env
          ROS_DOMAIN_ID=0
          EOF
          echo ">>> Khởi tạo .env thành công."

      - name: 🛠️ Build & Deploy with Docker Compose
        run: |
          cd ./robot-app
          # Sử dụng BuildKit và hiển thị chi tiết quá trình (progress=plain)
          # Việc build ROS 2 trên Pi có thể mất từ 5-15 phút tùy vào tốc độ thẻ nhớ, hãy kiên nhẫn.
          export DOCKER_BUILDKIT=1
          docker compose build --progress=plain
          
          # Chạy container sau khi build xong
          docker compose up -d
          
          # Dọn dẹp image cũ để tiết kiệm dung lượng thẻ nhớ
          docker image prune -f
