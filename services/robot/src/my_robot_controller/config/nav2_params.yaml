# Nav2 parameters for the single-robot mecanum AGV.
# Frames are supplied by slam_toolbox/AMCL, odom_node, and agv.urdf.xacro.
#
# ── Code-fixed (do not touch without retuning the full stack) ──────────────
#   - frames (base_footprint / odom / map)
#   - use_sim_time: false
#   - transform_tolerance: 0.25 (tightened for live TF)
#   - controller_frequency: 12 (CPU-safe on Pi 5 with SLAM + nav)
#   - controller yaw toleranced 0.12 rad
#
# ── On-robot tuning required (marked with @field-tune) ─────────────────────
#   - robot_radius / footprint (chassis + arm extension)
#   - inflation_radius / cost_scaling_factor (depends on shelf corridor width)
#   - min/max velocities and acc_lim (depends on motor + payload + floor)
#   - AMCL alpha1..5 (depends on encoder drift + IMU noise + floor slip)
#   - min_particles / max_particles (depends on warehouse area)
#   - local_costmap.width / height (depends on speed and sensor range)
#   - map_server.yaml_filename is overridden by nav2_launch.py; leave as
#     placeholder to keep the file valid when launched directly.
# See docs/ON_ROBOT_TUNING_CHECKLIST.md for the runbook.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.15
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.087
    resample_interval: 1
    # Tightened from 0.5 to 0.25 for live TF on Pi 5.
    transform_tolerance: 0.25
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: latest.yaml

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # Reduced from 20 Hz to 12 Hz to avoid CPU overload with SLAM + rplidar.
    # @field-tune: increase after confirming CPU headroom with `top`/`htop`.
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: "nav2_controller::SimpleFollowPath"
      # @field-tune: keep these aligned with the firmware PID saturation.
      # Hardware spec: max useful chassis velocity ≈ 0.30 m/s.
      # If robot is unstable, lower max_vel_x from 0.30 to 0.20.
      min_vel_x: -0.10
      max_vel_x: 0.30
      min_vel_y: -0.20
      max_vel_y: 0.20
      max_vel_theta: 0.50
      min_speed_xy: 0.02
      max_speed_xy: 0.30
      min_speed_theta: 0.05
      acc_lim_x: 0.20
      acc_lim_y: 0.20
      acc_lim_theta: 0.40
      decel_lim_x: -0.30
      decel_lim_y: -0.30
      decel_lim_theta: -0.50
      # Mirrors AMCL transform_tolerance to keep local planning consistent.
      transform_tolerance: 0.25

# Global map + static obstacles. The robot footprint is intentionally larger
# than the nominal 30 cm chassis to leave clearance for shelves and the arm.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.22
      footprint: "[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must match local_costmap inflation_radius — if global > local,
        # the global planner finds paths that the local controller then
        # refuses.  Align both to the tighter corridor-clearance value.
        cost_scaling_factor: 4.0
        inflation_radius: 0.32
      always_send_full_costmap: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      # @field-tune: keep footprint consistent with global_costmap.
      # robot_radius and footprint here MUST match the values above.
      robot_radius: 0.22
      footprint: "[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          obstacle_min_range: 0.15
          raytrace_min_range: 0.15
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # @field-tune:
        #   cost_scaling_factor ↓  → sharper obstacle boundary, less buffer
        #   cost_scaling_factor ↑  → softer gradient, smoother avoidance
        #   inflation_radius  ↓    → robot can squeeze through tighter gaps
        #   inflation_radius  ↑    → larger keep-out zone around obstacles
        # Default tuned for warehouse aisles ~80 cm wide.
        cost_scaling_factor: 4.0
        inflation_radius: 0.32
      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.25
    simulate_ahead_time: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Nav2's installed default tree includes planning, replanning, and recovery.
    default_nav_to_pose_bt_xml: "navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
    bond_timeout: 4.0
