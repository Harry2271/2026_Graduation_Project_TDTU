amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: latest.yaml

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_controller::SimpleFollowPath"
      min_vel_x: -0.1
      max_vel_x: 0.3
      max_vel_theta: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_xml_filename: "navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    autostart: true

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - bt_navigator
    bond_timeout: 4.0
