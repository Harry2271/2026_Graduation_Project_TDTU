slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: online

    # --- Map Update Frequency ---
    # Reduce to 2.0s to minimize drift accumulation between updates
    map_update_interval: 2.0

    # --- Odometry-free scanning (hand-carried) ---
    # Allow map updates while stationary for hand-held scanning
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    # --- Scan Matching ---
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.2

    # -------------------------------------------------------------------------
    # Occupancy Grid — Conservative thresholds for clean walls
    # -------------------------------------------------------------------------
    # Lower occ/unc thresholds = stricter occupancy decisions
    # Reduces scattered noise in free space
    occupancy_threshold: 0.65
    prior_threshold: 0.50

    # Speckle filter — REMOVE isolated single-point noise clusters
    # Only removes connected components smaller than this in FREE space
    # (not in occupied space)
    do_beams_backward_scan_cleanup: true

    # Scan buffer for outlier rejection
    scan_buffer_max_distance: 5.0
    scan_buffer_alpha: 0.1
    scan_buffer_phi: 0.15

    # -------------------------------------------------------------------------
    # Laser Range — CUT NOISE FROM DISTANT READINGS
    # -------------------------------------------------------------------------
    # 4.0m is optimal for indoor: cuts dust/air noise while covering rooms
    max_laser_range: 4.0

    # -------------------------------------------------------------------------
    # Loop Closure — reduce false positive loop matches
    # -------------------------------------------------------------------------
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
    loop_match_minimum_distance: 2.5

    # -------------------------------------------------------------------------
    # Correlation Search Space — tighter for stable walls
    # -------------------------------------------------------------------------
    smooth_lagged_matches: true
    correlation_search_space_dimension: 0.25
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Coarser search = faster + more stable, fine for indoor
    position_search_distance_resolution: 0.02
    angle_search_distance_resolution: 0.005

    # -------------------------------------------------------------------------
    # Variance penalty — reject glass/floor reflections
    # -------------------------------------------------------------------------
    distance_variance_penalty: 0.7
    angle_variance_penalty: 0.7

    # -------------------------------------------------------------------------
    # Solver — Ceres for Pi 5
    # -------------------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: DENSE_QR
    ceres_precoditioner: SCHUR_JACOBI
    ceres_loss_function: None
