slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: online

    # 1. Tăng tốc độ cập nhật bản đồ lên Foxglove (mỗi 1.5s thay vì 5.0s mặc định)
    map_update_interval: 1.5

    # 2. VÔ HIỆU HÓA rào cản odometry tĩnh (Cho = 0.0 để luôn luôn vẽ và nạp bản đồ khi cầm tay)
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    # 3. Kích hoạt tối đa tính năng khớp tia quét (Scan Matching) khi thiếu odometry bánh xe
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.2

    # Các cấu hình tối ưu bộ giải phương trình (Solver) cho Pi 5
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: DENSE_QR
    ceres_precoditioner: SCHUR_JACOBI
    ceres_loss_function: None
