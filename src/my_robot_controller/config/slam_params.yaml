slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: online

    # 1. Tăng tốc độ cập nhật bản đồ lên Foxglove (mỗi 1.5s thay vì 5.0s mặc định)
    map_update_interval: 1.5

    # 2. Chỉ cập nhật bản đồ khi robot di chuyển > 15cm (giảm nhiễu khi đứng yên)
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.05

    # 3. Kích hoạt tối đa tính năng khớp tia quét (Scan Matching) khi thiếu odometry bánh xe
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.1

    # -------------------------------------------------------------------------
    # 🌟 CÁC THÔNG SỐ KHỬ NHIỄU (NOISE FILTERING & CRISP WALLS)
    # -------------------------------------------------------------------------
    # Giới hạn tầm nhìn Lidar ở cự ly chuẩn 8.0 mét (Cắt bỏ hoàn toàn các tia xa bị nhiễu/suy hao)
    max_laser_range: 8.0

    # Tăng hình phạt sai số để loại bỏ các vệt tia phản xạ ảo từ cửa kính hoặc sàn bóng
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.5

    # Tối ưu hóa vòng lặp khử nhiễu đốm (Speckle filter / Loop closure)
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # -------------------------------------------------------------------------
    # ⚓ BỘ LỌC LÀM MỊN & CHỐNG RUNG LẮC BẢN ĐỒ (ANTI-WOBBLE STABILIZER)
    # -------------------------------------------------------------------------
    # Tự động làm mịn và nội suy các bước nhảy tọa độ để khóa chặt vách tường
    smooth_lagged_matches: true
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Khóa chặt dung sai góc xoay, ngăn hiện tượng xoay/giật bản đồ khi tay bị rung
    position_search_distance_resolution: 0.01
    angle_search_distance_resolution: 0.001
    # -------------------------------------------------------------------------

    # Các cấu hình tối ưu bộ giải phương trình (Solver) cho Pi 5
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: DENSE_QR
    ceres_precoditioner: SCHUR_JACOBI
    ceres_loss_function: None
