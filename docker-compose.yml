services:
  web-client:
    image: park-smart-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      # --- THÊM ĐOẠN NÀY ĐỂ TRUYỀN BIẾN LÚC BUILD ---
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      # ---------------------------------------------
      cache_from:
        - park-smart-web:latest
    container_name: web
    init: true
    # Port mapping: [Cổng ngoài con Pi]:[Cổng trong Next.js]
    # Mặc định Next.js chạy ở cổng 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    # Giới hạn tài nguyên trên Raspberry Pi để tránh OOM
    deploy:
      resources:
        limits:
          memory: 1G