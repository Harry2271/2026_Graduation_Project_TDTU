# =============================================================================
# docker-compose.yml — API + Web containers (production)
#
# Robot service is NOT Dockerized (needs physical hardware: serial ports, ROS 2,
# LiDAR, IMU, camera).
#
# Usage:
#   docker compose up -d                        # start both
#   docker compose up -d --build api            # rebuild + restart only API
#   docker compose up -d --build web            # rebuild + restart only Web
#   docker compose logs -f api                  # follow API logs
#   docker compose ps                           # check status
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nguyen-api
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
    volumes:
      - robot-maps:/home/pi/robot_ws/maps
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.nguyen-robot.io.vn}
        NEXT_PUBLIC_API_SOCKET_URL: ${NEXT_PUBLIC_API_SOCKET_URL:-https://api.nguyen-robot.io.vn}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://map.nguyen-robot.io.vn}
        NEXT_PUBLIC_WS_AUTH_TOKEN: ${NEXT_PUBLIC_WS_AUTH_TOKEN:-}
        NEXT_PUBLIC_CAMERA_STREAM_URL: ${NEXT_PUBLIC_CAMERA_STREAM_URL:-https://cam.nguyen-robot.io.vn/stream}
    container_name: nguyen-web
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  robot-maps:
