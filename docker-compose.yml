services:
  # 1. Core mapping system (giữ nguyên)
  robot-core:
    build: .
    container_name: robot_core
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    volumes:
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=0
      - LIDAR_MODEL=a1  # <-- Nếu ông dùng A1M8 thì để a1, dùng A2M8 thì sửa thành a2m8
      - LIDAR_PORT=/dev/ttyUSB0
    restart: always

  # 2. Cổng giao tiếp chuẩn ROSBridge WebSocket (Port 9090 cho Next.js Canvas 2D)
  rosbridge-server:
    build:
      context: .
      dockerfile: Dockerfile.rosbridge
    container_name: rosbridge_server
    network_mode: host
    ipc: host
    pid: host
    environment:
      - ROS_DOMAIN_ID=0
    restart: always