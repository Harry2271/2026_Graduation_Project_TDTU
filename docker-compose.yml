services:
  robot-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot_core
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
      - robot-maps:/app
      - /dev/serial/by-id:/dev/serial/by-id
    environment:
      - ROS_DOMAIN_ID=0
      - LIDAR_MODEL=a1
      - MAPPING_MODE=live
    ports:
      - "9091:9091"
    restart: always

volumes:
  robot-maps:
