services:
  robot-core:
    build:
      context: .
      dockerfile: Dockerfile.robotcore
    container_name: robot_core
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    volumes:
      - /dev:/dev
      - /dev/video0:/dev/video0          # USB webcam for QR detection
      - robot-maps:/app                  # Persist saved maps across restarts
      - /dev/serial/by-id:/dev/serial/by-id  # Symlinks for stable device IDs
    environment:
      - ROS_DOMAIN_ID=0
      - LIDAR_MODEL=a1                    # Use a1 for A1M8 lidar
      - CAMERA_DEVICE=0
      - MAPPING_MODE=live                # 'mapping' or 'live' — set to 'mapping' to auto-scan room
    ports:
      - "9091:9091"                     # WebBridge WebSocket JSON server
    restart: always

volumes:
  robot-maps:
