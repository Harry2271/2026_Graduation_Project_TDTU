services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: park-smart-api-container
    # Port mapping: [Cổng ngoài con Pi]:[Cổng trong NestJS]
    # Giả sử NestJS của ông chạy cổng 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    # Nếu ông cần kết nối trực tiếp với phần cứng/camera dễ dàng hơn, 
    # có thể dùng 'network_mode: host' thay cho ports ở trên
    # network_mode: host 
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"