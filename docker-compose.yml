services:
  # 1. Core robot system (Lidar + SLAM + Brain + QR Detector)
  robot-core:
    build:
      context: .
      dockerfile: Dockerfile.robotcore
      no_cache: true
    container_name: robot_core
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    volumes:
      - /dev:/dev
      - /dev/video0:/dev/video0          # USB webcam for QR detection
      - robot-maps:/app                  # Persist saved maps across restarts
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0        # Slamtec SLLidar
      - /dev/ttyUSB1:/dev/ttyUSB1        # ESP32-S3 motor controller
    environment:
      - ROS_DOMAIN_ID=0
      - LIDAR_MODEL=a1                    # Use a1 for A1M8 lidar
      - LIDAR_PORT=/dev/ttyUSB0
      - ESP32_PORT=/dev/ttyUSB1
      - CAMERA_DEVICE=0
      - MAPPING_MODE=live                # 'mapping' or 'live' — set to 'mapping' to auto-scan room
    ports:
      - "9091:9091"                       # WebBridge WebSocket JSON server
    restart: always

  # 2. ROSBridge WebSocket server (port 9090 for web frontend)
  rosbridge-server:
    build:
      context: .
      dockerfile: Dockerfile.rosbridge
    container_name: rosbridge_server
    network_mode: host
    ipc: host
    pid: host
    environment:
      - ROS_DOMAIN_ID=0
    restart: always

volumes:
  robot-maps:
