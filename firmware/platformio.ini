[env:weact-esp32s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM8
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
; Try both reset modes — fall back to manual BOOT if needed
upload_resetmethod = nodemcu

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include -I include/modules -I include/drivers
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_ARDUINO_EVENT_RUN_LOOP_CORE=0
    -DCONFIG_ARDUINO_EVENT_FORCE_RUN_LOOP=1
    -DCONFIG_ESP32S3_DEVKIT_JTAG_DISABLED=1
    -DCONFIG_JTAG_ENABLE=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=16384

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; ESP32-S3 USB-CDC pins are fixed (GPIO 19/20 D-/D+). GPIO 43/44 are
; free for UART0 = Serial0, used for the Pi 5 <-> ESP32-S3 hardware link.
