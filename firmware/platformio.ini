[env:weact-esp32s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
upload_port = COM8
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = true
upload_resetmethod = default

; WeAct N16R8: 16MB flash (QIO mode) + 8MB Octal PSRAM
; board_build defaults to the esp32-s3-devkitc-1 partition table (4MB).
; The WeAct N16R8 accepts this; flash mode is overridden per the actual
; SPI flash on the module.  Revert to defaults so firmware does not
; crash on missing partition-table CSV.

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include -I include/modules -I include/drivers
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_ARDUINO_EVENT_RUN_LOOP_CORE=0
    -DCONFIG_ARDUINO_EVENT_FORCE_RUN_LOOP=1
    -DCONFIG_ESP32S3_DEVKIT_JTAG_DISABLED=1
    -DCONFIG_JTAG_ENABLE=0
    -DCONFIG_ARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=16384

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
